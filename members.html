<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top" id="app-header"></header>
<div class="wrap">
  <div id="flash-holder"></div>
  <h2 class="section">Members</h2>
  <form class="search-bar" id="search-form">
    <input type="text" id="search-input" placeholder="Search by Member ID or name">
    <button class="btn" type="submit">Search</button>
  </form>
  <div class="row-actions" style="margin:0 0 16px;">
    <a class="btn" href="member-detail.html">+ Add Member</a>
    <button class="btn secondary" id="export-all">Export All (Word)</button>
  </div>
  <div class="card"><div id="members-holder">Loading…</div></div>
</div>

<script src="config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9/build/index.umd.js"></script>
<script src="js/reports.js"></script>
<script src="js/service-worker-register.js"></script>
<script>
function renderMembers(members) {
  const holder = document.getElementById("members-holder");
  if (members.length === 0) {
    holder.innerHTML = `<div class="empty">No members found.</div>`;
    return;
  }
  holder.innerHTML = `
    <table class="simple">
    <tr><th>ID</th><th>Name</th><th>Phone</th><th></th></tr>
    ${members
      .map(
        (m) => `
      <tr>
        <td>${m.member_code}</td>
        <td>${m.name}</td>
        <td>${m.phone_number || ""}</td>
        <td><a class="btn small" href="member-detail.html?id=${m.id}">View</a></td>
      </tr>`
      )
      .join("")}
    </table>`;
}

async function load() {
  const profile = await requireAuth("admin");
  if (!profile) return;
  await renderHeader("members", profile);
  const members = await getAllMembers();
  renderMembers(members);
}

document.getElementById("search-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = document.getElementById("search-input").value.trim();
  const members = q ? await searchMembers(q) : await getAllMembers();
  renderMembers(members);
});

document.getElementById("export-all").addEventListener("click", async () => {
  const [societyName, members] = await Promise.all([getSocietyName(), getAllMembersWithTotals()]);
  await exportAllMembersReport(societyName, members);
});

load().catch((e) => {
  console.error(e);
  flash("Couldn't load members: " + e.message, "error");
});
</script>
</body>
</html>
