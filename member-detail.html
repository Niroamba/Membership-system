<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top" id="app-header"></header>
<div class="wrap">
  <div id="flash-holder"></div>

  <!-- Add/Edit form -->
  <div id="form-section">
    <h2 class="section" id="form-title">Add Member</h2>
    <div class="card">
      <form id="member-form">
        <label>Member ID</label>
        <input type="text" id="f-code" required data-admin-only>
        <label>Name</label>
        <input type="text" id="f-name" required data-admin-only>
        <label>Phone Number</label>
        <input type="tel" id="f-phone" data-admin-only>
        <label>Joined Date</label>
        <input type="date" id="f-joined" data-admin-only>
        <label>Address</label>
        <input type="text" id="f-address" data-admin-only>
        <label>Remarks</label>
        <textarea id="f-remarks" data-admin-only></textarea>
        <div class="row-actions">
          <button class="btn" type="submit" data-admin-only>Save</button>
          <a class="btn secondary" href="members.html" id="cancel-link">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Payments view (reached via "View Payments" on the Members page) -->
  <div id="view-section" style="display:none;">
    <div class="card" style="padding:14px 18px;">
      <div style="font-family:Georgia,serif;font-size:18px;" id="view-name"></div>
      <div class="muted" id="view-meta" style="font-size:12.5px;"></div>
    </div>

    <div class="card">
      <div style="font-family:Georgia,serif;font-size:15px;margin-bottom:8px;">New Payment (Charge)</div>
      <form id="charge-form">
        <label>What is this payment for?</label>
        <select id="c-description" required data-admin-only></select>
        <label>Year</label>
        <select id="c-year" data-admin-only></select>
        <label>Total Amount (leave blank to use the category's amount, if any)</label>
        <input type="number" step="0.01" id="c-amount" placeholder="e.g. 4000.00" data-admin-only>
        <div class="row-actions"><button class="btn" type="submit" data-admin-only>Add Charge</button></div>
      </form>
    </div>

    <h2 class="section">Payment History</h2>
    <div id="charges-holder"><div class="empty">Loading…</div></div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9/build/index.umd.js"></script>
<script src="js/reports.js"></script>
<script src="js/service-worker-register.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const memberId = params.get("id");
let member = null;
let profile = null;

function fillForm(m) {
  document.getElementById("f-code").value = m.member_code || "";
  document.getElementById("f-name").value = m.name || "";
  document.getElementById("f-phone").value = m.phone_number || "";
  document.getElementById("f-joined").value = m.joined_date || "";
  document.getElementById("f-address").value = m.address || "";
  document.getElementById("f-remarks").value = m.remarks || "";
}

function readForm() {
  return {
    member_code: document.getElementById("f-code").value.trim(),
    name: document.getElementById("f-name").value.trim(),
    phone_number: document.getElementById("f-phone").value.trim() || null,
    joined_date: document.getElementById("f-joined").value || null,
    address: document.getElementById("f-address").value.trim() || null,
    remarks: document.getElementById("f-remarks").value.trim() || null,
  };
}

async function populateCategoryAndYearSelects() {
  const categories = await listCategories();
  const descSelect = document.getElementById("c-description");
  descSelect.innerHTML = categories.map((c) => `<option value="${c.name}">${c.name}</option>`).join("");
  const yearSelect = document.getElementById("c-year");
  const current = new Date().getFullYear();
  const years = [];
  for (let y = current - 5; y <= current + 1; y++) years.push(y);
  yearSelect.innerHTML = years.map((y) => `<option value="${y}" ${y === current ? "selected" : ""}>${y}</option>`).join("");
}

let expandedChargeIds = null;
let currentCharges = [];

async function renderCharges() {
  currentCharges = await getChargesForMember(member.id);
  if (expandedChargeIds === null) {
    expandedChargeIds = new Set(currentCharges.filter((c) => c.balance > 0).map((c) => c.id));
  }
  renderChargesList();
}

function renderChargesList() {
  const holder = document.getElementById("charges-holder");
  if (currentCharges.length === 0) {
    holder.innerHTML = `<div class="empty">No payments recorded for this member yet.</div>`;
    return;
  }
  holder.innerHTML = currentCharges
    .map((c) => {
      const isOpen = expandedChargeIds.has(c.id);
      const accent = c.balance <= 0 ? "#2BAE66" : "#FF5D5D";
      const badge =
        c.balance <= 0
          ? `<span class="badge paid">Paid</span>`
          : `<span class="badge unpaid">${money(c.balance)} due</span>`;
      const paymentsRows = (c.payments || [])
        .map(
          (p) => `
        <tr>
          <td>${p.installment_no}</td>
          <td>${money(p.amount)}</td>
          <td>${p.paid_date}</td>
          <td><button class="btn danger small" data-delete-payment="${p.id}" data-admin-only>Delete</button></td>
        </tr>`
        )
        .join("");
      return `
      <div class="card" data-charge-card="${c.id}" style="border-left:5px solid ${accent};padding:0;overflow:hidden;">
        <div class="charge-toggle" data-toggle-charge="${c.id}" style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
          <div>
            <div style="font-family:Georgia,serif;font-size:16px;">${c.description} <span class="muted" style="font-size:13px;">${c.year ? `(${c.year})` : ""}</span></div>
            <div class="muted" style="font-size:12.5px;">Total ${money(c.total_amount)} · Paid ${money(c.paid)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            ${badge}
            <span class="muted" style="font-size:13px;">${isOpen ? "▾" : "▸"}</span>
          </div>
        </div>
        ${isOpen ? `
        <div style="padding:0 16px 16px;border-top:1px solid #f0ece0;">
          ${
            c.payments.length
              ? `<table class="simple" style="margin-top:8px;"><tr><th>Installment</th><th>Amount</th><th>Date</th><th></th></tr>${paymentsRows}</table>`
              : `<div class="muted" style="margin-top:8px;">No payments yet.</div>`
          }
          <form class="payment-form row-actions" data-charge-id="${c.id}" style="margin-top:10px;align-items:end;">
            <div><label style="margin-top:0;">Amount</label><input type="number" step="0.01" name="amount" required style="width:120px;" data-admin-only></div>
            <div><label style="margin-top:0;">Date</label><input type="date" name="paid_date" value="${new Date().toISOString().slice(0,10)}" data-admin-only></div>
            <div><label style="margin-top:0;">Receipt Book #</label><input type="text" name="receipt_book_no" style="width:100px;" data-admin-only></div>
            <div><label style="margin-top:0;">Receipt #</label><input type="text" name="receipt_no" style="width:100px;" data-admin-only></div>
            <button class="btn small" type="submit" data-admin-only>Add Payment</button>
          </form>
          <button class="btn danger small" data-delete-charge="${c.id}" style="margin-top:6px;" data-admin-only>Delete Charge</button>
        </div>` : ""}
      </div>`;
    })
    .join("");

  holder.querySelectorAll("[data-toggle-charge]").forEach((row) => {
    row.addEventListener("click", () => {
      const id = row.dataset.toggleCharge;
      const numericId = currentCharges.find((c) => String(c.id) === String(id))?.id ?? id;
      if (expandedChargeIds.has(numericId)) {
        expandedChargeIds.delete(numericId);
      } else {
        expandedChargeIds.add(numericId);
      }
      renderChargesList();
    });
  });

  holder.querySelectorAll(".payment-form").forEach((form) => {
    form.addEventListener("click", (e) => e.stopPropagation());
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const chargeId = form.dataset.chargeId;
      const fd = new FormData(form);
      try {
        await addPayment(chargeId, parseFloat(fd.get("amount")), fd.get("paid_date"), fd.get("receipt_book_no"), fd.get("receipt_no"));
        flash("Payment recorded.", "success");
        await renderCharges();
      } catch (err) {
        flash(err.message, "error");
      }
    });
  });

  holder.querySelectorAll("[data-delete-payment]").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm("Delete this payment?")) return;
      await deletePayment(btn.dataset.deletePayment);
      await renderCharges();
    });
  });

  holder.querySelectorAll("[data-delete-charge]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this entire charge and its payment history?")) return;
      await deleteCharge(btn.dataset.deleteCharge);
      await renderCharges();
    });
  });

  applyViewerRestrictions(profile);
}

document.getElementById("member-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fields = readForm();
  if (!fields.member_code || !fields.name) {
    flash("Member ID and Name are required.", "error");
    return;
  }
  try {
    if (member) {
      await updateMember(member.id, fields);
      flash("Member updated.", "success");
      window.location.href = `member-detail.html?id=${member.id}`;
    } else {
      const created = await addMember(fields);
      flash(`Member ${created.member_code} added.`, "success");
      window.location.href = `member-detail.html?id=${created.id}`;
    }
  } catch (err) {
    flash(err.message.includes("duplicate") ? "That Member ID is already in use." : err.message, "error");
  }
});

document.getElementById("charge-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const description = document.getElementById("c-description").value;
  const year = parseInt(document.getElementById("c-year").value, 10);
  let amountRaw = document.getElementById("c-amount").value.trim();
  try {
    let amount = amountRaw ? parseFloat(amountRaw) : await getEffectiveCategoryAmount(description, year);
    if (!amount || amount <= 0) {
      flash("Please enter a valid total amount (this category has no default set).", "error");
      return;
    }
    await addCharge(member.id, description, year, amount);
    flash(`Added '${description}' charge for ${year}.`, "success");
    document.getElementById("c-amount").value = "";
    await renderCharges();
  } catch (err) {
    flash(err.message, "error");
  }
});

async function load() {
  profile = await requireAuth("admin_or_viewer");
  if (!profile) return;
  if (!memberId && profile.role === "viewer") {
    window.location.href = "members.html";
    return;
  }
  await renderHeader("members", profile);

  if (memberId) {
    member = await getMember(memberId);
    const wantsEdit = params.get("edit") === "1" && profile.role === "admin";

    document.getElementById("form-section").style.display = wantsEdit ? "" : "none";
    document.getElementById("view-section").style.display = wantsEdit ? "none" : "";
    document.getElementById("cancel-link").href = `member-detail.html?id=${member.id}`;

    if (wantsEdit) {
      document.getElementById("form-title").textContent = "Edit Member";
      fillForm(member);
      return;
    }

    document.getElementById("view-name").textContent = `${member.name} (${member.member_code})`;
    document.getElementById("view-meta").innerHTML = `
      ${member.phone_number || ""}${member.address ? " · " + member.address : ""}
      ${member.remarks ? "<br>Remarks: " + member.remarks : ""}
    `;
    await populateCategoryAndYearSelects();
    await renderCharges();
  } else {
    document.getElementById("form-title").textContent = "Add Member";
  }
}

load().catch((e) => {
  console.error(e);
  flash("Couldn't load this page: " + e.message, "error");
});
</script>
</body>
</html>
