<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Record Payment</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .rp-layout{ display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  .rp-form-col{ flex:1.3; min-width:280px; }
  .rp-history-col{ flex:1; min-width:240px; }
  .rp-result-item{ padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px; }
  .rp-result-item:hover{ background:#eaf2fb; }
  .rp-history-row{ font-size:12.5px; padding:8px 0; border-bottom:1px solid #f0ece0; }
  .rp-history-row .amt{ font-weight:600; }
  .rp-history-row .meta{ color:#8a8474; font-size:11px; }
</style>
</head>
<body>
<header class="top" id="app-header"></header>
<div class="wrap">
  <div id="flash-holder"></div>

  <div class="rp-layout">
    <div class="rp-form-col">
      <div class="bold-wrap">
        <div class="bold-toolbar"><h2>Record payment</h2></div>
        <div class="bold-wrap-body">
          <label style="margin-top:0;">Member ID or name</label>
          <div class="row-actions" style="margin:0;">
            <input type="text" id="search-input" placeholder="Search…">
            <button class="btn small" id="search-btn">Search</button>
          </div>
          <div id="search-results" style="margin-top:8px;"></div>

          <div id="selected-member-block" style="display:none;margin-top:14px;">
            <div style="font-weight:700;font-size:14.5px;color:#1F2430;margin-bottom:10px;" id="selected-member-name"></div>

            <form id="payment-form">
              <label style="margin-top:0;">Category</label>
              <select id="p-category" required data-admin-only></select>
              <label>Year</label>
              <select id="p-year" data-admin-only></select>

              <div id="new-charge-note" class="muted" style="font-size:12px;display:none;margin:6px 0;">
                No existing charge for this category/year yet — it will be created.
              </div>
              <label id="total-label" style="display:none;">Total Amount for this charge</label>
              <input type="number" step="0.01" id="p-total" placeholder="Total amount" style="display:none;" data-admin-only>

              <label>Payment Amount</label>
              <input type="number" step="0.01" id="p-amount" required data-admin-only>
              <label>Date</label>
              <input type="date" id="p-date" data-admin-only>
              <div class="row-actions">
                <div style="flex:1;"><label style="margin-top:0;">Receipt Book #</label><input type="text" id="p-receipt-book" data-admin-only></div>
                <div style="flex:1;"><label style="margin-top:0;">Receipt #</label><input type="text" id="p-receipt-no" data-admin-only></div>
              </div>
              <div class="row-actions">
                <button class="btn" type="submit" data-admin-only>Save Payment</button>
                <button class="btn secondary" type="button" id="reset-btn">Reset</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="rp-history-col">
      <div class="card">
        <div style="font-family:Georgia,serif;font-size:15px;margin-bottom:8px;">Payment history</div>
        <div id="history-holder" class="muted">Search for and select a member to see their recent payments.</div>
        <div id="history-link" style="display:none;margin-top:10px;">
          <a class="btn secondary small" href="#" id="view-all-payments-link">View all payments →</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/data.js"></script>
<script src="js/service-worker-register.js"></script>
<script>
let selectedMember = null;

async function populateCategoryYearSelects() {
  const categories = await listCategories();
  document.getElementById("p-category").innerHTML = categories.map((c) => `<option value="${c.name}">${c.name}</option>`).join("");
  const current = new Date().getFullYear();
  const years = [];
  for (let y = 1980; y <= current + 1; y++) years.push(y);
  document.getElementById("p-year").innerHTML = years
    .map((y) => `<option value="${y}" ${y === current ? "selected" : ""}>${y}</option>`)
    .join("");
  document.getElementById("p-date").value = new Date().toISOString().slice(0, 10);
}

async function refreshChargeContext() {
  if (!selectedMember) return;
  const category = document.getElementById("p-category").value;
  const year = parseInt(document.getElementById("p-year").value, 10);
  const existing = await getChargeForMemberCategoryYear(selectedMember.id, category, year);
  const note = document.getElementById("new-charge-note");
  const totalLabel = document.getElementById("total-label");
  const totalInput = document.getElementById("p-total");
  if (existing) {
    note.style.display = "none";
    totalLabel.style.display = "none";
    totalInput.style.display = "none";
    totalInput.value = "";
  } else {
    note.style.display = "";
    totalLabel.style.display = "";
    totalInput.style.display = "";
    const effective = await getEffectiveCategoryAmount(category, year);
    totalInput.value = effective != null ? effective : "";
  }
}

async function renderHistory() {
  const holder = document.getElementById("history-holder");
  const linkBlock = document.getElementById("history-link");
  if (!selectedMember) {
    holder.innerHTML = `<span class="muted">Search for and select a member to see their recent payments.</span>`;
    linkBlock.style.display = "none";
    return;
  }
  const charges = await getChargesForMember(selectedMember.id);
  const flat = [];
  charges.forEach((c) => (c.payments || []).forEach((p) => flat.push({ ...p, description: c.description, year: c.year })));
  flat.sort((a, b) => (a.paid_date < b.paid_date ? 1 : -1));
  if (flat.length === 0) {
    holder.innerHTML = `<span class="muted">No payments recorded yet.</span>`;
  } else {
    holder.innerHTML = flat
      .slice(0, 8)
      .map(
        (p) => `
      <div class="rp-history-row">
        <span class="amt">${money(p.amount)}</span> · ${p.paid_date}
        <div class="meta">${p.description}${p.year ? " " + p.year : ""}</div>
      </div>`
      )
      .join("");
  }
  linkBlock.style.display = "";
  document.getElementById("view-all-payments-link").href = `member-detail.html?id=${selectedMember.id}`;
}

document.getElementById("search-btn").addEventListener("click", doSearch);
document.getElementById("search-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); doSearch(); }
});

async function doSearch() {
  const q = document.getElementById("search-input").value.trim();
  const results = q ? await searchMembers(q) : [];
  const holder = document.getElementById("search-results");
  if (results.length === 0) {
    holder.innerHTML = q ? `<div class="muted" style="font-size:12.5px;">No matches.</div>` : "";
    return;
  }
  holder.innerHTML = results
    .map((m) => `<div class="rp-result-item" data-id="${m.id}">${m.name} <span class="muted">(${m.member_code})</span></div>`)
    .join("");
  holder.querySelectorAll("[data-id]").forEach((el) => {
    el.addEventListener("click", () => selectMember(el.dataset.id, results));
  });
}

async function selectMember(id, results) {
  selectedMember = results.find((m) => String(m.id) === String(id));
  document.getElementById("search-results").innerHTML = "";
  document.getElementById("search-input").value = "";
  document.getElementById("selected-member-block").style.display = "";
  document.getElementById("selected-member-name").textContent = `${selectedMember.name} (${selectedMember.member_code})`;
  await refreshChargeContext();
  await renderHistory();
}

document.getElementById("p-category").addEventListener("change", refreshChargeContext);
document.getElementById("p-year").addEventListener("change", refreshChargeContext);

document.getElementById("reset-btn").addEventListener("click", () => {
  document.getElementById("payment-form").reset();
  document.getElementById("p-date").value = new Date().toISOString().slice(0, 10);
  refreshChargeContext();
});

document.getElementById("payment-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!selectedMember) return;
  const category = document.getElementById("p-category").value;
  const year = parseInt(document.getElementById("p-year").value, 10);
  const amount = parseFloat(document.getElementById("p-amount").value);
  const date = document.getElementById("p-date").value;
  const receiptBook = document.getElementById("p-receipt-book").value.trim();
  const receiptNo = document.getElementById("p-receipt-no").value.trim();

  try {
    let charge = await getChargeForMemberCategoryYear(selectedMember.id, category, year);
    if (!charge) {
      const totalRaw = document.getElementById("p-total").value.trim();
      const total = totalRaw ? parseFloat(totalRaw) : await getEffectiveCategoryAmount(category, year);
      if (!total || total <= 0) {
        flash("This category has no default amount — enter a Total Amount for the new charge.", "error");
        return;
      }
      charge = await addCharge(selectedMember.id, category, year, total);
    }
    await addPayment(charge.id, amount, date, receiptBook, receiptNo);
    flash(`Payment of ${money(amount)} recorded for ${selectedMember.name}.`, "success");
    document.getElementById("p-amount").value = "";
    await refreshChargeContext();
    await renderHistory();
  } catch (err) {
    flash(err.message, "error");
  }
});

async function load() {
  const profile = await requireAuth("admin_or_viewer");
  if (!profile) return;
  await renderHeader("record-payment", profile);
  applyViewerRestrictions(profile);
  await populateCategoryYearSelects();
}

load().catch((e) => flash("Couldn't load Record Payment: " + e.message, "error"));
</script>
</body>
</html>
