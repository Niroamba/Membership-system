<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <div class="card center-card">
    <h2 class="section" style="margin:0 0 16px;">Set a new password</h2>
    <form id="reset-form">
      <label>New Password</label>
      <input type="password" id="new-password" minlength="6" required>
      <div class="row-actions"><button class="btn" type="submit" style="width:100%;">Save new password</button></div>
    </form>
    <div id="flash-holder"></div>
  </div>
</div>
<script src="config.js"></script>
<script src="js/supabaseClient.js"></script>
<script>
document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = document.getElementById("new-password").value;
  const { error } = await window.supabaseClient.auth.updateUser({ password });
  const holder = document.getElementById("flash-holder");
  if (error) {
    holder.innerHTML = `<div class="flash error">${error.message}</div>`;
    return;
  }
  holder.innerHTML = `<div class="flash success">Password updated. Redirecting to sign in…</div>`;
  setTimeout(() => (window.location.href = "login.html"), 1500);
});
</script>
</body>
</html>
