<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Details</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .status-tabs{ display:flex; gap:6px; margin-top:12px; }
  .status-tab{ border:none; background:#fff; color:#2952E3; font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:8px; cursor:pointer; border:1.5px solid #2952E3; }
  .status-tab.active{ background:#2952E3; color:#fff; }
</style>
</head>
<body>
<header class="top" id="app-header"></header>
<div class="wrap">
  <div id="flash-holder"></div>

  <div class="bold-wrap" style="margin-top:16px;">
    <div class="bold-toolbar">
      <h2>Payment details</h2>
      <div class="bold-actions">
        <button class="bold-btn gold" id="export-btn">Export to Word</button>
      </div>
    </div>
    <div class="bold-wrap-body">
      <div class="row-actions" style="margin:0;align-items:end;">
        <div><label style="margin-top:0;">Category</label><select id="f-category"></select></div>
        <div><label style="margin-top:0;">Year</label><select id="f-year"><option value="">All years</option></select></div>
      </div>
      <div class="status-tabs">
        <button class="status-tab active" data-status="all">All</button>
        <button class="status-tab" data-status="paid">Fully Paid</button>
        <button class="status-tab" data-status="outstanding">Outstanding</button>
      </div>
    </div>
  </div>

  <div class="card"><div id="rows-holder"><div class="empty">Choose a category above.</div></div></div>
</div>

<script src="config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9/build/index.umd.js"></script>
<script src="js/reports.js"></script>
<script src="js/service-worker-register.js"></script>
<script>
let allRows = [];
let currentCategory = "";
let currentYear = "";
let currentStatus = "all";

function filteredRows() {
  if (currentStatus === "paid") return allRows.filter((r) => r.balance <= 0);
  if (currentStatus === "outstanding") return allRows.filter((r) => r.balance > 0);
  return allRows;
}

async function refreshYears() {
  const years = await listYearsForCategory(currentCategory);
  const sel = document.getElementById("f-year");
  sel.innerHTML =
    `<option value="">All years</option>` +
    years.map((y) => `<option value="${y}" ${String(y) === currentYear ? "selected" : ""}>${y}</option>`).join("");
}

async function refreshRows() {
  allRows = currentCategory ? await getChargesByCategory(currentCategory, currentYear ? parseInt(currentYear, 10) : null) : [];
  renderRows();
}

function renderRows() {
  const rows = filteredRows();
  const holder = document.getElementById("rows-holder");
  if (rows.length === 0) {
    holder.innerHTML = `<div class="empty">No charges match this filter${currentYear ? " for " + currentYear : ""}.</div>`;
    return;
  }
  holder.innerHTML = `
    <table class="simple">
    <tr><th>ID</th><th>Name</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th>Last Payment</th></tr>
    ${rows
      .map(
        (r) => `
      <tr>
        <td>${r.member_code}</td>
        <td><a href="member-detail.html?id=${r.member_id}">${r.member_name}</a></td>
        <td>${money(r.total_amount)}</td>
        <td>${money(r.paid)}</td>
        <td>${money(r.balance)}</td>
        <td>${r.balance <= 0 ? `<span class="badge paid">Fully Paid</span>` : `<span class="badge unpaid">Outstanding</span>`}</td>
        <td>${r.last_payment_date || ""}</td>
      </tr>`
      )
      .join("")}
    </table>`;
}

document.getElementById("f-category").addEventListener("change", async () => {
  currentCategory = document.getElementById("f-category").value;
  currentYear = "";
  await refreshYears();
  await refreshRows();
});

document.getElementById("f-year").addEventListener("change", async () => {
  currentYear = document.getElementById("f-year").value;
  await refreshRows();
});

document.querySelectorAll(".status-tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    currentStatus = btn.dataset.status;
    document.querySelectorAll(".status-tab").forEach((b) => b.classList.toggle("active", b === btn));
    renderRows();
  });
});

document.getElementById("export-btn").addEventListener("click", async () => {
  if (!currentCategory) { flash("Choose a category first.", "error"); return; }
  const societyName = await getSocietyName();
  const label = currentStatus === "paid" ? "Fully Paid" : currentStatus === "outstanding" ? "Outstanding" : "Total";
  await exportCategoryReport(societyName, currentCategory, currentYear ? parseInt(currentYear, 10) : null, filteredRows(), label);
});

async function load() {
  const profile = await requireAuth("admin_or_viewer");
  if (!profile) return;
  await renderHeader("payment-details", profile);
  applyViewerRestrictions(profile);
  const categories = await listCategories();
  document.getElementById("f-category").innerHTML = categories.map((c) => `<option value="${c.name}">${c.name}</option>`).join("");
  currentCategory = categories.length ? categories[0].name : "";
  await refreshYears();
  await refreshRows();
}

load().catch((e) => flash("Couldn't load payment details: " + e.message, "error"));
</script>
</body>
</html>
