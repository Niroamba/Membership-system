<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top" id="app-header"></header>
<div class="wrap">
  <div id="flash-holder"></div>

  <div id="news-section" style="display:none;">
    <h2 class="section">Announcements</h2>
    <div class="card" id="news-holder"></div>
  </div>

  <h2 class="section">Overview</h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div style="background:#2952E3;border-radius:12px;padding:14px;">
      <div style="color:#c9d4fb;font-size:12px;">Members</div>
      <div style="color:#fff;font-size:24px;font-weight:600;font-family:Georgia,serif;" id="tile-members">—</div>
    </div>
    <div style="background:#2BAE66;border-radius:12px;padding:14px;">
      <div style="color:#dcf5e6;font-size:12px;">Collected</div>
      <div style="color:#fff;font-size:24px;font-weight:600;font-family:Georgia,serif;" id="tile-collected">—</div>
    </div>
    <div style="background:#FFB627;border-radius:12px;padding:14px;">
      <div style="color:#5c3f00;font-size:12px;">Expected</div>
      <div style="color:#3d2900;font-size:24px;font-weight:600;font-family:Georgia,serif;" id="tile-expected">—</div>
    </div>
    <div style="background:#FF5D5D;border-radius:12px;padding:14px;">
      <div style="color:#fff0ef;font-size:12px;">Outstanding</div>
      <div style="color:#fff;font-size:24px;font-weight:600;font-family:Georgia,serif;" id="tile-outstanding">—</div>
    </div>
  </div>

  <div class="row-actions" style="margin:18px 0;">
    <a class="btn" href="members.html">View all members</a>
    <a class="btn secondary" href="member-detail.html" data-admin-only>+ Add member</a>
  </div>
</div>

<script src="config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/data.js"></script>
<script src="js/service-worker-register.js"></script>
<script>
async function load() {
  const profile = await requireAuth("admin_or_viewer");
  if (!profile) return;
  await renderHeader("dashboard", profile);
  applyViewerRestrictions(profile);

  const news = await getAllNews();
  if (news.length) {
    document.getElementById("news-section").style.display = "";
    document.getElementById("news-holder").innerHTML = news
      .slice(0, 3)
      .map(
        (n) => `
      <div style="border-left:3px solid #a9812f;padding:6px 12px;margin-bottom:10px;">
        <div style="font-family:Georgia,serif;font-size:15px;">${n.title}</div>
        <div class="muted" style="font-size:11px;">${new Date(n.posted_on).toLocaleDateString()}</div>
        <div style="font-size:13px;white-space:pre-wrap;">${n.content}</div>
      </div>`
      )
      .join("");
  }

  const members = await getAllMembersWithTotals();
  const totals = summarizeTotals(members);
  document.getElementById("tile-members").textContent = totals.total_members;
  document.getElementById("tile-collected").textContent = money(totals.total_collected);
  document.getElementById("tile-expected").textContent = money(totals.total_expected);
  document.getElementById("tile-outstanding").textContent = money(totals.total_outstanding);
}

load().catch((e) => {
  console.error(e);
  flash("Something went wrong loading the dashboard: " + e.message, "error");
});
</script>
</body>
</html>
