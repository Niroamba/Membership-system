<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Removed Members</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top" id="app-header"></header>
<div class="wrap">
  <div id="flash-holder"></div>
  <h2 class="section">Removed Members</h2>
  <div class="row-actions" style="margin:0 0 16px;">
    <button class="btn secondary" id="export-btn">Export (Word)</button>
  </div>
  <div class="card"><div id="rows-holder">Loading…</div></div>
</div>

<script src="config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9/build/index.umd.js"></script>
<script src="js/reports.js"></script>
<script src="js/service-worker-register.js"></script>
<script>
let rows = [];
async function load() {
  const profile = await requireAuth("admin_or_viewer");
  if (!profile) return;
  await renderHeader("removed-members", profile);
  applyViewerRestrictions(profile);
  rows = await getRemovedMembers();
  const holder = document.getElementById("rows-holder");
  if (rows.length === 0) {
    holder.innerHTML = `<div class="empty">No members have been removed.</div>`;
    return;
  }
  holder.innerHTML = `
    <table class="simple">
    <tr><th>ID</th><th>Name</th><th>Phone</th><th>Reason</th><th>Removed On</th><th>By</th></tr>
    ${rows
      .map(
        (r) => `
      <tr>
        <td>${r.member_code || ""}</td><td>${r.name || ""}</td><td>${r.phone_number || ""}</td>
        <td>${r.reason || ""}</td><td>${new Date(r.removed_on).toLocaleDateString()}</td><td>${r.removed_by || ""}</td>
      </tr>`
      )
      .join("")}
    </table>`;
}

document.getElementById("export-btn").addEventListener("click", async () => {
  const societyName = await getSocietyName();
  await exportRemovedMembersReport(societyName, rows);
});

load().catch((e) => flash("Couldn't load removed members: " + e.message, "error"));
</script>
</body>
</html>
